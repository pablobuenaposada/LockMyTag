server {
    listen 80;
    server_name _;

    # Nginx has no mime type for .mjs, and a browser refuses to run a module
    # served as anything but JavaScript. MapLibre loads its worker from a .mjs
    # sibling, so this is what keeps the map working.
    location ~ \.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
    }

    location /static/ {
        alias /app/static/;
        autoindex on;
    }

    # The Apple session lives behind this one. Only the fetcher needs it, and
    # it reaches the app directly, so nothing should arrive here from outside.
    # An exact match beats the regex below.
    location = /api/account/ {
        return 404;
    }

    location ~ ^/(admin|api)/ {
        proxy_pass http://backoffice:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}