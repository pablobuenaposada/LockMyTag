<html>
  <head>
    <title>LockMyTag</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@6.8.0/dist/maplibre-gl.css"
    />
    <script type="importmap">
      {
        "imports": {
          "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
          "maplibre-gl": "https://unpkg.com/maplibre-gl@6.8.0/dist/maplibre-gl.mjs",
          "@maplibre/maplibre-gl-leaflet": "https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/dist/leaflet-maplibre-gl.mjs"
        }
      }
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="sidebar">
      <h2>
        <button
          type="button"
          id="show-all"
          title="Show every tag and clear the selection"
        >
          <svg class="show-all-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Tags
        </button>
      </h2>
      <div id="tags-list"></div>
    </div>
    <div id="map">
      <script type="module" src="map.js"></script>
    </div>
  </body>
</html>
