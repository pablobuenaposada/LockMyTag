<html>
  <head>
    <title>LockMyTag</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css" />
    <script type="importmap">
      {
        "imports": {
          "leaflet": "./vendor/leaflet/leaflet-src.esm.js",
          "maplibre-gl": "./vendor/maplibre-gl/maplibre-gl.js",
          "@maplibre/maplibre-gl-leaflet": "./vendor/maplibre-gl-leaflet/leaflet-maplibre-gl.js"
        }
      }
    </script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="sidebar">
      <div id="sidebar-top">
        <h2>
          <button
            type="button"
            id="show-all"
            title="Show every tag and clear the selection"
          >
            <svg class="show-all-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Tags
          </button>
        </h2>
        <button type="button" id="logout" title="Log out">
          <svg class="logout-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M6 2H3v12h3M10 5l3 3-3 3M13 8H6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="visually-hidden">Log out</span>
        </button>
      </div>
      <div id="tags-list"></div>
    </div>
    <div id="map">
      <script type="module" src="map.js"></script>
    </div>
  </body>
</html>
